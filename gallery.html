<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya in Pictures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="gallery-header">
        <h1>Kenya in Pictures</h1>
        <p>A visual journey through the sights of Kenya</p>
    </div>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Kenyan landscape 1">
            <p class="caption">Savannah at sunrise</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Kenyan landscape 2">
            <p class="caption">Coastal shoreline</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=3" alt="Kenyan landscape 3">
            <p class="caption">Highland tea fields</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Kenyan landscape 4">
            <p class="caption">City skyline</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=5" alt="Kenyan landscape 5">
            <p class="caption">Rift Valley view</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=6" alt="Kenyan landscape 6">
            <p class="caption">Market day</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=7" alt="Kenyan landscape 7">
            <p class="caption">Lake shoreline</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=8" alt="Kenyan landscape 8">
            <p class="caption">Forest trail</p>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=9" alt="Kenyan landscape 9">
            <p class="caption">Village at dusk</p>
        </div>
    </div>

</body>
</html>
